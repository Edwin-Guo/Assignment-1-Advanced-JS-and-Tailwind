<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"> </script>
</head>
<body class = "min-h-screen bg-slate-100">
  <header class ="border-b bg-white border-slate-300">
    <div class = "max-w-5xl mx-auto py-5 px-4 flex justify-between items-center">
      <a href = "index.html" class = "text-xl py-2 px-4 rounded-lg cursor-pointer font-semibold
      focus:font-bold focus:bg-blue-200
      hover:bg-blue-300">
        Unit Converter
      </a>
      <div class = "flex gap-2">
        
        <a href = "weight.html" class = "py-2 px-4 rounded-lg font-semibold cursor-pointer
         hover:bg-blue-300
         focus:font-bold focus:bg-blue-200">
          Weight
        </a>

        <a href = "distance.html" class = "py-2 px-4 rounded-lg font-semibold cursor-pointer
         hover:bg-blue-300
         focus:font-bold focus:bg-blue-200">
          Distance
        </a>

        <a href = "#" class = "py-2 px-4 rounded-lg cursor-pointer
         hover:bg-blue-300
         font-bold bg-blue-200">
          Temperature
        </a>
      </div>
    </div>
  </header>
  <!-- Written by Stephanie -->
  <main class="max-w-5xl mx-auto px-4 py-10 grid sm:grid-cols-2 gap-6">
    <div class="bg-white border border-slate-300 rounded-lg p-6">
      <h2 class="font-semibold mb-4">Celsius → Fahrenheit</h2>
      <input id="celsius-input" type="text" placeholder="e.g. 20 or 0, 20, 100"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3">
      <button id="celsius-button"
        class="w-full bg-blue-200 hover:bg-blue-300 font-semibold rounded-lg py-2 px-4">
        Convert
      </button>
      <p id="celsius-result" class="mt-4 font-mono"></p>
    </div>

    <div class="bg-white border border-slate-300 rounded-lg p-6">
      <h2 class="font-semibold mb-4">Fahrenheit → Celsius</h2>
      <input id="fahrenheit-input" type="text" placeholder="e.g. 68 or 32, 68, 212"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3">
      <button id="fahrenheit-button"
        class="w-full bg-blue-200 hover:bg-blue-300 font-semibold rounded-lg py-2 px-4">
        Convert
      </button>
      <p id="fahrenheit-result" class="mt-4 font-mono"></p>
    </div>
  </main>
    <footer class = "mx-auto my-5 p-4 text-center border-t bg-white border-slate-300 text-slate-600 text-xs">
      <p>To input arrays, add commas between the values.</p>
      <p>If result is NaN, please ensure input values are Numbers</p>
      <p><br>Made by Adrianne Shean Pacifico, Edwin Guo, Stephanie Marquez</p>
    </footer>
  <script src="../dist/main.js"></script>
</body>
</html>
