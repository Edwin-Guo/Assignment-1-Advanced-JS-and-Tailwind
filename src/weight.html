<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"> </script>
</head>
<body class = "min-h-screen bg-slate-100">
  <header class ="border-b bg-white border-slate-300">
    <div class = "max-w-5xl mx-auto py-5 px-4 flex justify-between items-center">
      <a href = "index.html" class = "text-xl py-2 px-4 rounded-lg cursor-pointer font-semibold
      focus:font-bold focus:bg-blue-200
      hover:bg-blue-300">
        Unit Converter
      </a>
      <div class = "flex gap-2">
        
        <a href = "#" class = "py-2 px-4 rounded-lg cursor-pointer
         hover:bg-blue-300
         font-bold bg-blue-200">
          Weight
        </a>

        <a href = "distance.html" class = "py-2 px-4 rounded-lg font-semibold cursor-pointer
         hover:bg-blue-300
         focus:font-bold focus:bg-blue-200">
          Distance
        </a>

        <a href = "temperature.html" class = "py-2 px-4 rounded-lg font-semibold cursor-pointer
         hover:bg-blue-300
         focus:font-bold focus:bg-blue-200">
          Temperature
        </a>
      </div>
    </div>
  </header>
  <main class = "max-w-5xl mx-auto grid grid-cols-2 gap-5 py-5 px-4">
    <div class = "bg-red-700 rounded-3xl shadow-lg p-6">
      <h3 class = "text-lg font-bold text-slate-50">Pounds to Kilograms</h3>
      <label for = "pounds-input" class = "block text-sm font-semibold text-slate-50 mt-5 mb-2">Pounds</label>
      <input id = "pounds-input" type = "number" value = "0" class = "w-full rounded-lg border border-slate-900 px-4 py-2 text-slate-50 shadow-lg focus:border-slate-50 focus:outline-none"/>
      <button id = "pounds-button" class = "w-full mt-4 rounded-lg bg-white px-4 py-2 font-semibold text-black hover:bg-red-500 transition cursor-pointer">Convert</button>
      <div class = "mt-5 rounded-lg bg-red-200 p-4 text-center">
        <p class = "text-xs uppercase tracking-wide text-slate-500">Pounds</p>
        <p id = "pounds-result" class = "text-2xl font-bold text-red-900 mt-1">0.00</p>
      </div>
    </div>

    <div class = "bg-blue-700 rounded-3xl shadow-lg p-6">
      <h3 class = "text-lg font-bold text-slate-50">Kilograms to Pounds</h3>
      <label for = "kg-input" class = "block text-sm font-semibold text-slate-50 mt-5 mb-2">Kilograms</label>
      <input id = "kg-input" type = "number" value = "0" class = "w-full rounded-lg border border-slate-900 px-4 py-2 text-slate-50 shadow-lg focus:border-slate-50 focus:outline-none"/>
      <button id = "kg-button" class = "w-full mt-4 rounded-lg bg-white px-4 py-2 font-semibold text-black hover:bg-blue-500 transition cursor-pointer">Convert</button>
      <div class = "mt-5 rounded-lg bg-blue-200 p-4 text-center">
        <p class = "text-xs uppercase tracking-wide text-slate-500">Kilograms</p>
        <p id = "kg-result" class = "text-2xl font-bold text-blue-900 mt-1">0.00</p>
      </div>
    </div>
  </main>
  <script src="../dist/main.js"></script>
</body>
</html>
